[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trinity-demo-scripts"
version = "1.0.0"
description = "Demo scripts for Trinity Guard - PyCon Kenya 2026"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Maurice Nyanja", email = "maurice@trinity-guard.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/trinity-guard/trinity-demo-scripts"
Repository = "https://github.com/trinity-guard/trinity-demo-scripts"

[tool.hatch.build.targets.wheel]
packages = ["trinity_demo"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = "ruff check {args}"
type-check = "mypy {args}"

[tool.ruff]
target-version = "py314"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
